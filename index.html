<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--
  ================================================================
   VỎ APP CHẤM CÔNG – NÓN LÁ COFFEE
   Chỉ cần sửa 1 dòng: dán link ứng dụng web Apps Script (đuôi /exec)
   vào biến APP_URL bên dưới (trong thẻ <script>), rồi lưu lại.
  ================================================================
-->
<title>Nón Lá Coffee – Chấm công</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ứng dụng chấm công nhân viên Nón Lá Coffee">
<meta name="theme-color" content="#4a2c1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nón Lá">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{margin:0;height:100%;background:#f7f1e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b1d14;overflow:hidden}
  #frame{position:fixed;left:0;right:0;top:0;bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-bottom));border:0;background:#f7f1e8;opacity:0;transition:opacity .3s}
  #frame.ready{opacity:1}
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);background:#fff}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;background:#f7f1e8;transition:opacity .35s}
  .screen.hide{opacity:0;pointer-events:none}
  .screen img{width:180px;height:180px;border-radius:36px;box-shadow:0 12px 34px rgba(74,44,29,.18)}
  .spin{width:34px;height:34px;border-radius:50%;border:4px solid #e7d9c4;border-top-color:#4a2c1d;animation:sp .8s linear infinite;margin-top:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .msg{font-size:15px;color:#8a7a6d;max-width:320px;line-height:1.5}
  .msg b{color:#2b1d14}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 26px;background:#4a2c1d;color:#fff;margin-top:6px}
  code{background:#efe5d6;padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
</style>
</head>
<body>

<div class="screen" id="splash">
  <img src="icons/logo-256.png" alt="Nón Lá Coffee – Coffee &amp; Tea">
  <div class="spin" id="spin"></div>
  <div class="msg" id="msg">Đang mở ứng dụng chấm công…</div>
  <button id="retry" style="display:none" onclick="start()">Thử lại</button>
</div>

<iframe id="frame" title="Chấm công Nón Lá Coffee"
  allow="clipboard-write; geolocation; camera"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* ====== DÁN LINK ỨNG DỤNG WEB APPS SCRIPT (ĐUÔI /exec) VÀO GIỮA HAI DẤU NHÁY ====== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwmUzRVIAkfIajHKjUMT01io-JlMss_5ROOvzPGg5kpHwTD1RwgBvyZB9GO7uIkqrlWYA/exec';
  /* ================================================================================ */

  var frame = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var msg = document.getElementById('msg');
  var spin = document.getElementById('spin');
  var retry = document.getElementById('retry');
  var timer = null;

  function show(text, canRetry) {
    msg.innerHTML = text;
    spin.style.display = canRetry === null ? '' : 'none';
    retry.style.display = canRetry ? '' : 'none';
    splash.classList.remove('hide');
  }

  function validUrl(u) {
    return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec/.test(u);
  }

  function start() {
    if (!validUrl(APP_URL)) {
      show('<b>Chưa cài link ứng dụng.</b><br>Mở file <code>index.html</code>, dán link Apps Script có đuôi <code>/exec</code> vào dòng <code>APP_URL</code> rồi lưu lại.', false);
      return;
    }
    if (!navigator.onLine) {
      show('<b>Không có kết nối mạng.</b><br>Hãy bật Wi-Fi hoặc 4G rồi thử lại.', true);
      return;
    }
    show('Đang mở ứng dụng chấm công…', null);
    frame.classList.remove('ready');
    frame.onload = function () {
      clearTimeout(timer);
      frame.classList.add('ready');
      splash.classList.add('hide');
    };
    clearTimeout(timer);
    timer = setTimeout(function () {
      show('<b>Mạng đang chậm.</b><br>Ứng dụng chưa mở được, hãy kiểm tra kết nối rồi thử lại.', true);
    }, 25000);
    frame.src = APP_URL;
  }

  window.addEventListener('online', function () { if (!frame.classList.contains('ready')) start(); });
  window.addEventListener('offline', function () {
    if (!frame.classList.contains('ready')) show('<b>Không có kết nối mạng.</b><br>Hãy bật Wi-Fi hoặc 4G rồi thử lại.', true);
  });

  /* Lấy GPS giúp app chấm công bên trong (khung của Google có thể bị trình duyệt chặn định vị).
     Chỉ trả lời các khung đến từ Google Apps Script. */
  var GAS_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/;
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type !== 'nonla-gps-request' || !d.id || !e.source || !GAS_ORIGIN.test(e.origin)) return;
    var reply = function (obj) { obj.id = d.id; try { e.source.postMessage(obj, e.origin); } catch (x) {} };
    reply({ type: 'nonla-gps-ack' });
    if (!navigator.geolocation) { reply({ type: 'nonla-gps', ok: false, error: 'Điện thoại không hỗ trợ định vị.' }); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      reply({ type: 'nonla-gps', ok: true, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
    }, function (err) {
      var m = err.code === 1 ? 'Bạn chưa cho phép app Nón Lá dùng vị trí. Vào Cài đặt điện thoại → Vị trí → cho phép, rồi thử lại.'
        : err.code === 2 ? 'Không xác định được vị trí. Hãy bật GPS (Vị trí) trên điện thoại.'
        : 'Lấy vị trí quá lâu. Hãy bật "Vị trí chính xác" và thử lại.';
      reply({ type: 'nonla-gps', ok: false, error: m });
    }, { enableHighAccuracy: true, timeout: 18000, maximumAge: 0 });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  start();
</script>
</body>
</html>
